name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      node: 22
                    - os: ubuntu-latest
                      node: 24
                    - os: windows-latest
                      node: 22
                    - os: macos-latest
                      node: 22
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Format check
              run: pnpm format:check
            - name: Lint
              run: pnpm lint
            - name: Typecheck
              run: pnpm typecheck
            - name: Unit tests
              run: pnpm test
            - name: Content tests
              run: pnpm exec vitest run --project content
            - name: Validate content
              run: pnpm content:validate
            - name: Build
              run: pnpm build

    integration:
        name: Integration and security (PostgreSQL 16)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: praxbit
                    POSTGRES_PASSWORD: praxbit_ci
                    POSTGRES_DB: praxbit_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U praxbit -d praxbit_test" --health-interval 5s --health-timeout 5s --health-retries 20
        env:
            DATABASE_URL: postgres://praxbit:praxbit_ci@127.0.0.1:5432/praxbit_test
            NODE_ENV: test
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Migrate test database
              run: pnpm db:migrate
            - name: Integration tests
              run: pnpm test:integration
            - name: Security tests
              run: pnpm test:security

    android:
        name: Android debug build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build web assets
              run: pnpm --filter @praxbit/web build
            - name: Sync Capacitor Android
              run: pnpm --filter @praxbit/web exec cap sync android
            - name: Assemble debug APK
              working-directory: apps/web/android
              run: |
                  chmod +x gradlew
                  ./gradlew assembleDebug --no-daemon
            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: praxbit-android-debug
                  path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 7

    ios:
        name: iOS simulator build
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build web assets
              run: pnpm --filter @praxbit/web build
            - name: Sync Capacitor iOS
              run: pnpm --filter @praxbit/web exec cap sync ios
            - name: Build simulator app
              working-directory: apps/web/ios/App
              run: |
                  xcodebuild \
                    -project App.xcodeproj \
                    -target App \
                    -configuration Debug \
                    -sdk iphonesimulator \
                    -derivedDataPath build \
                    CODE_SIGNING_ALLOWED=NO \
                    build
            - name: Upload simulator app
              uses: actions/upload-artifact@v4
              with:
                  name: praxbit-ios-simulator
                  path: apps/web/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
                  retention-days: 7

    browser:
        name: Browser, accessibility, and visual tests
        runs-on: ubuntu-latest
        timeout-minutes: 90
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: praxbit
                    POSTGRES_PASSWORD: praxbit_ci
                    POSTGRES_DB: praxbit_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U praxbit -d praxbit_test" --health-interval 5s --health-timeout 5s --health-retries 20
        env:
            DATABASE_URL: postgres://praxbit:praxbit_ci@127.0.0.1:5432/praxbit_test
            NODE_ENV: test
            HOST: 127.0.0.1
            PORT: 8787
            COOKIE_SECURE: "0"
            TRUST_PROXY: "0"
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Migrate test database
              run: pnpm db:migrate
            - name: Build
              run: pnpm build
            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit
            - name: Start API
              run: |
                  pnpm --filter @praxbit/server start > /tmp/praxbit-server.log 2>&1 &
                  echo $! > /tmp/praxbit-server.pid
                  for attempt in $(seq 1 30); do
                    if curl --fail --silent http://127.0.0.1:8787/readyz > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "API did not become healthy"
                  cat /tmp/praxbit-server.log
                  exit 1
            - name: Verify production web serving
              run: |
                  curl --fail --silent http://127.0.0.1:8787/missions/python.collections | grep --quiet '<div id="root">'
                  test "$(curl --fail --silent --output /dev/null --write-out '%{content_type}' http://127.0.0.1:8787/pyodide/pyodide.mjs)" = "text/javascript; charset=utf-8"
            - name: Verify both production hostnames
              run: pnpm verify:hosting -- --base http://127.0.0.1:8787
            - name: Playwright tests (desktop, tablet, mobile, firefox, webkit)
              run: pnpm exec playwright test
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
            - name: Show API log on failure
              if: failure()
              run: cat /tmp/praxbit-server.log
            - name: Stop API
              if: always()
              run: |
                  if [ -f /tmp/praxbit-server.pid ]; then
                    kill "$(cat /tmp/praxbit-server.pid)" 2>/dev/null || true
                  fi
