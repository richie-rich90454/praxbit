# Praxbit behind an existing Nginx installation.
# Include this file from the http block, for example as
# /etc/nginx/conf.d/praxbit.conf. It does not replace unrelated server blocks.
# Edit the certificate paths after obtaining a certificate that covers both
# hostnames. Do not add a static root: the Hono process serves the web build,
# its CSP, and its security headers.

upstream praxbit_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name praxbit.biszweb.club praxbit.bisz.dev;

    server_tokens off;
    access_log /var/log/nginx/praxbit-http-access.log;
    error_log /var/log/nginx/praxbit-error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name praxbit.biszweb.club praxbit.bisz.dev;

    ssl_certificate /etc/letsencrypt/live/praxbit.bisz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxbit.bisz.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:praxbit_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 60s;

    access_log /var/log/nginx/praxbit-access.log;
    error_log /var/log/nginx/praxbit-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, do not append. A client-supplied X-Forwarded-For would spoof
    # the rate-limit key when TRUST_PROXY=1. If another trusted proxy is in
    # front, configure real_ip with its addresses first.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "DENY" always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    proxy_hide_header Permissions-Policy;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;

    location / {
        proxy_pass http://praxbit_app;
    }
}
